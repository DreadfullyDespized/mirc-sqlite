name: proof
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wine32, xvfb, xdotool
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine32 wine64 xvfb xdotool curl
      - name: Fetch the 2009 msqlite.dll baseline
        run: |
          curl -sSL --retry 3 --max-time 120 "https://raw.githubusercontent.com/DreadfullyDespized/mirc/main/scripts/mrcs/msqlite.dll" -o /tmp/msqlite-2009.dll
          ls -la /tmp/msqlite-2009.dll
      - name: Install mingw-w64 i686
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-mingw-w64-i686
      - name: Fetch SQLite amalgamation
        run: |
          bash tools/fetch-sqlite.sh
      - name: Build the new DLL
        run: |
          bash tools/build.sh
      - name: Proof run against the 2009 DLL
        env:
          OUT: /tmp/mirc-sqlite-proof
        run: |
          bash tools/proof/run.sh old /tmp/msqlite-2009.dll
      - name: Proof run against the new DLL
        env:
          OUT: /tmp/mirc-sqlite-proof
        run: |
          bash tools/proof/run.sh new build/msqlite.dll
      - name: Diff old vs new behavior
        run: |
          bash tools/proof/diff.sh /tmp/mirc-sqlite-proof/old/proof.log /tmp/mirc-sqlite-proof/new/proof.log
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs
          path: /tmp/mirc-sqlite-proof/
          if-no-files-found: warn
