name: proof
on:
  push:
    branches: [main]
  pull_request:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wine32, xvfb, xdotool
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine32 xvfb xdotool curl
      - name: Verify mIRC 7.79 installer checksum
        run: |
          echo "05be4812a3c0a0a1f412f22262b3cef7  tools/proof/deps/mirc779.exe" | md5sum -c -
      - name: Silent-install mIRC 7.79 into a Wine prefix
        run: |
          export WINEPREFIX=$HOME/.wine-mirc-proof WINEARCH=win32 WINEDEBUG=-all
          xvfb-run -a wine tools/proof/deps/mirc779.exe /S
          MIRC_EXE=$(find "$WINEPREFIX/drive_c" -iname mirc.exe -print -quit)
          [ -n "$MIRC_EXE" ] || { echo "mirc.exe not found after install"; find "$WINEPREFIX/drive_c" -maxdepth 3 | head -20; exit 1; }
          echo "MIRC_EXE=$MIRC_EXE" >> "$GITHUB_ENV"
      - name: Fetch the 2009 msqlite.dll baseline
        run: |
          curl -sSL --retry 3 --max-time 120 "https://raw.githubusercontent.com/DreadfullyDespized/mirc/main/scripts/mrcs/msqlite.dll" -o /tmp/msqlite-2009.dll
          ls -la /tmp/msqlite-2009.dll
      - name: Build the new DLL
        run: |
          sh tools/build.sh
      - name: Proof run against the 2009 DLL
        env:
          OUT: /tmp/mirc-sqlite-proof
        run: |
          sh tools/proof/run.sh old /tmp/msqlite-2009.dll
      - name: Proof run against the new DLL
        env:
          OUT: /tmp/mirc-sqlite-proof
        run: |
          sh tools/proof/run.sh new build/msqlite.dll
      - name: Diff old vs new behavior
        run: |
          sh tools/proof/diff.sh /tmp/mirc-sqlite-proof/old/proof.log /tmp/mirc-sqlite-proof/new/proof.log
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs
          path: /tmp/mirc-sqlite-proof/
          if-no-files-found: warn
