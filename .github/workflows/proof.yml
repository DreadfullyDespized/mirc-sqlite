name: proof
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wine32, xvfb, xdotool
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wine32 wine64 xvfb xdotool curl
      - name: Check for the mIRC installer
        run: |
          if [ ! -f tools/proof/deps/mirc-installer.exe ]; then
            echo "mIRC installer not found at tools/proof/deps/mirc-installer.exe"
            echo "See tools/proof/README.md for how to provide it."
            exit 1
          fi
          file tools/proof/deps/mirc-installer.exe | grep -q "PE32" || { echo "not a PE installer"; exit 1; }
      - name: Silent-install mIRC into a Wine prefix
        env:
          WINEPREFIX: /home/runner/.wine-mirc-proof
          WINEARCH: win64
          WINEDEBUG: -all
        run: |
          rm -rf "$WINEPREFIX"
          xvfb-run -a /usr/lib/wine/wine64 wineboot --init
          xvfb-run -a wine tools/proof/deps/mirc-installer.exe /S
          MIRC_EXE=$(find "$WINEPREFIX/drive_c" -iname mirc.exe -print -quit)
          [ -n "$MIRC_EXE" ] || { echo "mirc.exe not found after install"; find "$WINEPREFIX/drive_c" -maxdepth 3 | head -20; exit 1; }
          echo "MIRC_EXE=$MIRC_EXE" >> "$GITHUB_ENV"
      - name: Fetch the 2009 msqlite.dll baseline
        run: |
          curl -sSL --retry 3 --max-time 120 "https://raw.githubusercontent.com/DreadfullyDespized/mirc/main/scripts/mrcs/msqlite.dll" -o /tmp/msqlite-2009.dll
          ls -la /tmp/msqlite-2009.dll
      - name: Install mingw-w64 i686
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-mingw-w64-i686
      - name: Fetch SQLite amalgamation
        run: |
          bash tools/fetch-sqlite.sh
      - name: Build the new DLL
        run: |
          bash tools/build.sh
      - name: Proof run against the 2009 DLL
        env:
          OUT: /tmp/mirc-sqlite-proof
        run: |
          bash tools/proof/run.sh old /tmp/msqlite-2009.dll
      - name: Proof run against the new DLL
        env:
          OUT: /tmp/mirc-sqlite-proof
        run: |
          bash tools/proof/run.sh new build/msqlite.dll
      - name: Diff old vs new behavior
        run: |
          bash tools/proof/diff.sh /tmp/mirc-sqlite-proof/old/proof.log /tmp/mirc-sqlite-proof/new/proof.log
      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs
          path: /tmp/mirc-sqlite-proof/
          if-no-files-found: warn
