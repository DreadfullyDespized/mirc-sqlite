name: pii-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  pii-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: No PII in the PR body, added lines, or commit messages
        if: always()
        env:
          PII_TERMS: ${{ secrets.PII_TERMS }}
        run: python3 tools/checks/pii_check.py --event "$GITHUB_EVENT_PATH"
      - name: No code comments in any file
        if: always()
        run: python3 tools/checks/no_new_comments.py --all
      - name: Prior FAIL blockers still unfixed
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/checks/prior_fail_check.py --event "$GITHUB_EVENT_PATH"
