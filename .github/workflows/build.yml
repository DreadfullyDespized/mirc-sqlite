name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 i686
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gcc-mingw-w64-i686
      - name: Fetch SQLite amalgamation
        run: |
          bash tools/fetch-sqlite.sh
      - name: Build 32-bit DLL
        run: |
          bash tools/build.sh
      - name: Verify 32-bit PE
        run: |
          file build/msqlite.dll | grep -q "PE32 executable" || (echo "not a 32-bit PE. Fix: rebuild with i686-w64-mingw32-gcc so build/msqlite.dll is a PE32 executable." && exit 1)
      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: msqlite.dll
          path: build/msqlite.dll
      - name: Build failure names the fix
        if: failure()
        run: |
          echo "::error::The 32-bit DLL build failed. Fix: make bash tools/build.sh write a PE32 build/msqlite.dll (mingw-w64 i686, tools/fetch-sqlite.sh, and the compile), then push that change to this branch."
          echo "::error::Fix it on this same PR: push the fix to this branch. Do not close and reopen a copy. Do not rerun CI without a change."
