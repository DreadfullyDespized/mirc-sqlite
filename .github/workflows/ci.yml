name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  repo-ci:
    uses: dreadedpotato/.github/.github/workflows/repo-ci.yml@0792c23c328b1c99e26a6694dec87079e44f7b28
    with:
      runner: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
      max-file-mb: ${{ fromJSON(vars.CI_MAX_FILE_MB || '10') }}
      allowed-email: ${{ vars.CI_ALLOWED_EMAIL || '5559848+DreadfullyDespized@users.noreply.github.com' }}
